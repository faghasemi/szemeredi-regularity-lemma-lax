name: Publish Lax draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Lax CLI
        run: npm install --global lax-archive@0.1.16

      - name: Authorize Lax identity
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clientId = "Ov23liKn5mlmnnP9Gyz2";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function oauthPost(path, body) {
            const response = await fetch(`https://github.com${path}`, {
              method: "POST",
              headers: {
                accept: "application/json",
                "content-type": "application/json",
              },
              body: JSON.stringify(body),
            });
            if (!response.ok) {
              throw new Error(`GitHub returned ${response.status} for ${path}`);
            }
            return response.json();
          }

          const device = await oauthPost("/login/device/code", {
            client_id: clientId,
          });
          console.log(`AUTHORIZE_LAX: ${device.verification_uri}`);
          console.log(`LAX_DEVICE_CODE: ${device.user_code}`);
          console.log(
            `::notice title=Authorize Lax::Open ${device.verification_uri} and enter ${device.user_code}`,
          );

          const deadline = Date.now() + device.expires_in * 1000;
          let interval = Math.max(device.interval, 1) * 1000;
          let token;
          while (Date.now() <= deadline) {
            await sleep(interval);
            const result = await oauthPost("/login/oauth/access_token", {
              client_id: clientId,
              device_code: device.device_code,
              grant_type: "urn:ietf:params:oauth:grant-type:device_code",
            });
            if (result.access_token) {
              token = result.access_token;
              break;
            }
            if (result.error === "slow_down") {
              interval += 5000;
            } else if (result.error !== "authorization_pending") {
              throw new Error(`GitHub authorization failed: ${result.error}`);
            }
          }
          if (!token) throw new Error("GitHub device authorization expired");

          console.log(`::add-mask::${token}`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `LAX_GITHUB_TOKEN=${token}\n`,
          );
          NODE

      - name: Allocate official Lax identifier
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const response = await fetch("https://laxarchive.org/init", {
            method: "POST",
            headers: {
              authorization: `Bearer ${process.env.LAX_GITHUB_TOKEN}`,
              "content-type": "application/json",
            },
            body: "{}",
          });
          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Lax allocation failed (${response.status}): ${text}`);
          }
          const result = JSON.parse(text);
          if (!/^Lax[1-9][0-9]*$/.test(result.id)) {
            throw new Error(`Unexpected Lax identifier: ${result.id}`);
          }
          console.log(`Official Lax identifier: ${result.id}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `LAX_ID=${result.id}\n`);
          NODE

      - name: Prepare official submission package
        run: |
          tar -xzf regularity-lemma-lax-publish-source.tar.gz
          mv regularity-lemma-lax regularity-lemma
          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path("regularity-lemma")
          lax_id = os.environ["LAX_ID"]

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              path.write_text(text.replace("Lax9999", lax_id))

          (root / "concepts" / "Lax9999").rename(root / "concepts" / lax_id)
          (root / "concepts" / "Lax9999.lean").rename(
              root / "concepts" / f"{lax_id}.lean"
          )
          (root / "proofs" / "Lax9999Proofs").rename(
              root / "proofs" / f"{lax_id}Proofs"
          )
          (root / "proofs" / "Lax9999Proofs.lean").rename(
              root / "proofs" / f"{lax_id}Proofs.lean"
          )
          PY

      - name: Replay the complete proof
        run: lax build --replay regularity-lemma

      - name: Commit the official package
        run: |
          rm regularity-lemma-lax-publish-source.tar.gz
          rm .github/workflows/publish-lax.yml
          git config user.name "Fatemeh Ghasemi"
          git config user.email "fatemeh.ghasemi@lacl.fr"
          git add --all
          git commit -m "Add ${LAX_ID} Szemeredi regularity lemma"
          git push origin HEAD:main

      - name: Submit replaceable Lax draft
        run: lax submit regularity-lemma
